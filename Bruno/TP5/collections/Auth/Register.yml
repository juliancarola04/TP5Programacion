info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:7128/api/auth/register
  body:
    type: json
    data: |-
      {
        "username": "username",
        "password": "password",
        "email": "email"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
