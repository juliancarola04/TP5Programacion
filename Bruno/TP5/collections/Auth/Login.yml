info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:7128/api/auth/login
  body:
    type: json
    data: |-
      {
        "username": "username",
        "password": "password"
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
