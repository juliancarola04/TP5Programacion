info:
  name: Actualizar
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:7128/api/usuarios/actualizar
  body:
    type: json
    data: |-
      {
        "username" : "username",
        "email" : "email",
        "password" : "password"
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
